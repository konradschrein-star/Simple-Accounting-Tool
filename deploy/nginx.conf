# Host nginx in front of deploy/docker-compose.nginx.yml. TLS is added by `certbot --nginx -d <host>`.
server {
    listen 80;
    listen [::]:80;
    server_name cashflow.schreinercontentsystems.com;

    # Statements and receipts up to 10 MB, plus multipart overhead.
    client_max_body_size 12m;

    # Review deployment: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, never append: the app rate-limits by the first X-Forwarded-For entry, so a client-sent value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/cashflow.access.log;
    error_log  /var/log/nginx/cashflow.error.log;
}
